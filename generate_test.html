# AI Test Scenario & Testcase Generator Dashboard

## frontend/templates/index.html

```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI QA Automation Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .main-container {
            padding: 30px;
        }

        .glass-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        textarea {
            min-height: 220px;
            background: #111827 !important;
            color: white !important;
            border: 1px solid #374151 !important;
        }

        input, select {
            background: #111827 !important;
            color: white !important;
            border: 1px solid #374151 !important;
        }

        .btn-custom {
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: bold;
        }

        h2 {
            font-weight: bold;
            margin-bottom: 20px;
        }

        .pane-title {
            color: #38bdf8;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container-fluid main-container">

    <h1 class="text-center mb-4">AI Test Scenario & Testcase Generator</h1>

    <!-- FORM SECTION -->
    <div class="glass-card">
        <h2 class="pane-title">Scenario Configuration</h2>

        <form id="scenarioForm">
            <div class="row">

                <div class="col-md-4 mb-3">
                    <label>Type of Scenarios</label>
                    <select class="form-select" id="scenarioType">
                        <option value="input_schema">Input Schema</option>
                        <option value="output_schema">Output Schema</option>
                        <option value="extra_information">Extra Information</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Method</label>
                    <select class="form-select" id="method">
                        <option>GET</option>
                        <option>POST</option>
                        <option>PUT</option>
                        <option>PATCH</option>
                        <option>DELETE</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Execution Type</label>
                    <select class="form-select" id="executionType">
                        <option value="stepwise">Stepwise Execution</option>
                        <option value="all_at_once">All At Once</option>
                    </select>
                </div>

            </div>

            <div class="mb-3">
                <label>Functionality Details</label>
                <textarea class="form-control" id="functionality"></textarea>
            </div>

            <div class="mb-3">
                <label>Validation Token (If Authentication Required)</label>
                <input type="text" class="form-control" id="token">
            </div>

            <button type="button" class="btn btn-primary btn-custom" onclick="submitScenario()">
                Submit Configuration
            </button>
        </form>
    </div>


    <!-- SCENARIO PANE -->
    <div class="glass-card">
        <h2 class="pane-title">Generated Scenarios</h2>

        <textarea id="scenarioPane" class="form-control"></textarea>

        <div class="mt-3 d-flex gap-3">
            <button class="btn btn-success btn-custom" onclick="addScenario()">
                Add
            </button>

            <button class="btn btn-warning btn-custom" onclick="generateTestcases()">
                Generate
            </button>
        </div>
    </div>


    <!-- TESTCASE PANE -->
    <div class="glass-card">
        <h2 class="pane-title">Generated Testcases</h2>

        <textarea id="testcasePane" class="form-control"></textarea>

        <div class="mt-3 d-flex gap-3">
            <button class="btn btn-info btn-custom" onclick="reviewTestcases()">
                Review
            </button>

            <button class="btn btn-danger btn-custom" onclick="runTestcases()">
                Run
            </button>
        </div>
    </div>


    <!-- RESULT PANE -->
    <div class="glass-card">
        <h2 class="pane-title">Execution Results</h2>

        <textarea id="resultPane" class="form-control" readonly></textarea>

        <div class="mt-3">
            <button class="btn btn-light btn-custom" onclick="generateReport()">
                Generate Report
            </button>
        </div>
    </div>

</div>

<script>

async function submitScenario() {

    const payload = {
        scenario_type: document.getElementById("scenarioType").value,
        method: document.getElementById("method").value,
        execution_type: document.getElementById("executionType").value,
        functionality: document.getElementById("functionality").value,
        token: document.getElementById("token").value
    }

    const response = await fetch('/submit-config', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
    })

    const data = await response.json()

    document.getElementById("scenarioPane").value = data.scenarios
}


async function addScenario() {

    const scenarios = document.getElementById("scenarioPane").value

    const response = await fetch('/add-scenario', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ scenarios })
    })

    const data = await response.json()

    document.getElementById("scenarioPane").value = data.updated_scenarios
}


async function generateTestcases() {

    const scenarios = document.getElementById("scenarioPane").value

    const response = await fetch('/generate-testcases', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ scenarios })
    })

    const data = await response.json()

    document.getElementById("testcasePane").value = data.testcases
}


async function reviewTestcases() {

    const testcases = document.getElementById("testcasePane").value

    const response = await fetch('/review-testcases', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ testcases })
    })

    const data = await response.json()

    document.getElementById("testcasePane").value = data.reviewed_code
}


async function runTestcases() {

    const testcases = document.getElementById("testcasePane").value

    const response = await fetch('/run-testcases', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ testcases })
    })

    const data = await response.json()

    document.getElementById("resultPane").value = data.results
}


async function generateReport() {

    const results = document.getElementById("resultPane").value

    const response = await fetch('/generate-report', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ results })
    })

    const data = await response.json()

    alert(data.report)
}

</script>

</body>
</html>
